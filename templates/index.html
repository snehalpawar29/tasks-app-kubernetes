<!DOCTYPE html>
<html>

<head>

    <title>Task Manager</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:40px;
        }

        .container{
            width:700px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
        }

        input{
            width:70%;
            padding:10px;
        }

        button{
            padding:10px 15px;
            cursor:pointer;
        }

        li{
            list-style:none;
            padding:10px;
            margin-top:10px;
            background:#efefef;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Task Manager</h2>

<input
id="task"
placeholder="Enter Task">

<button onclick="addTask()">
Add
</button>

<button onclick="deleteAll()">
Delete All
</button>

<hr>

<ul id="taskList"></ul>

</div>

<script>

loadTasks();

async function loadTasks(){

    let response=await fetch("/tasks");

    let result=await response.json();

    let html="";

    result.data.forEach(task=>{

        html+=`
        <li>

        <input
        id="${task.id}"
        value="${task.task}">

        <button
        onclick="updateTask('${task.id}')">
        Update
        </button>

        <button
        onclick="deleteTask('${task.id}')">
        Delete
        </button>

        </li>
        `;

    });

    document.getElementById("taskList").innerHTML=html;

}

async function addTask(){

    let task=document.getElementById("task").value;

    if(task==""){
        alert("Enter task");
        return;
    }

    await fetch("/task",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            task:task
        })

    });

    document.getElementById("task").value="";

    loadTasks();

}

async function updateTask(id){

    let task=document.getElementById(id).value;

    await fetch("/task/"+id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            task:task
        })

    });

    loadTasks();

}

async function deleteTask(id){

    if(!confirm("Delete this task?"))
        return;

    await fetch("/task/"+id,{
        method:"DELETE"
    });

    loadTasks();

}

async function deleteAll(){

    if(!confirm("Delete all tasks?"))
        return;

    await fetch("/tasks/delete",{
        method:"POST"
    });

    loadTasks();

}

</script>

</body>

</html>
